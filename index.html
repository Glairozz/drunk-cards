<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drunk Cards</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>
    <div class="bg-grid"></div>
    <div class="particles" id="particles"></div>
    
    <div id="app">
        <main>
            <section id="screen1" class="screen active">
                <div class="logo-wrapper">
                    <div class="logo-glow"></div>
                    <div class="logo-icon">
                        <span class="icon-inner">🍻</span>
                    </div>
                </div>
                <h1 class="title">
                    <span class="title-line">Drunk</span>
                    <span class="title-line accent">Cards</span>
                </h1>
                <p class="tagline">
                    <span class="tagline-dot"></span>
                    Party Game Edition
                    <span class="tagline-dot"></span>
                </p>
                <button class="premium-btn start-btn" data-action="goto" data-screen="2">
                    <span class="btn-bg"></span>
                    <span class="btn-text">
                        <span class="btn-text-inner">Start Party</span>
                        <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M5 12h14M12 5l7 7-7 7"/>
                        </svg>
                    </span>
                    <span class="btn-particles"></span>
                </button>
                <div class="version">v2.0</div>
            </section>

            <section id="screen2" class="screen">
                <div class="screen-header">
                    <div class="icon-wrapper">
                        <div class="screen-icon">📜</div>
                        <div class="icon-ring"></div>
                    </div>
                    <h2>How to Play</h2>
                </div>
                <div class="rules-container">
                    <div class="rule-card">
                        <div class="rule-icon">🎴</div>
                        <div class="rule-content">
                            <span class="rule-num">01</span>
                            <p>Draw cards and complete the challenge</p>
                        </div>
                        <div class="rule-line"></div>
                    </div>
                    <div class="rule-card">
                        <div class="rule-icon">😏</div>
                        <div class="rule-content">
                            <span class="rule-num">02</span>
                            <p>When someone skips, they drink 2x</p>
                        </div>
                        <div class="rule-line"></div>
                    </div>
                    <div class="rule-card">
                        <div class="rule-icon">🎉</div>
                        <div class="rule-content">
                            <span class="rule-num">03</span>
                            <p>Have fun and drink responsibly!</p>
                        </div>
                    </div>
                </div>
                <button class="premium-btn play-btn" data-action="start-game">
                    <span class="btn-bg"></span>
                    <span class="btn-content">
                        <span class="btn-text-inner">Play Now</span>
                        <span class="btn-icon">🎮</span>
                    </span>
                    <span class="btn-glow"></span>
                </button>
            </section>

            <section id="screen3" class="screen">
                <div class="game-header">
                    <div class="deck-wrapper">
                        <div class="deck-visual">
                            <div class="deck-stack">
                                <div class="deck-card"></div>
                                <div class="deck-card"></div>
                                <div class="deck-card"></div>
                            </div>
                        </div>
                        <div class="deck-info">
                            <span class="deck-label">Deck</span>
                            <span class="deck-count">104</span>
                        </div>
                    </div>
                    <div id="counter" class="card-counter">
                        <div class="counter-ring"></div>
                        <span class="counter-current">1</span>
                        <span class="counter-divider">/</span>
                        <span class="counter-total">104</span>
                    </div>
                </div>
                
                <div id="cardContainer">
                    <div class="card-trail"></div>
                    <div class="card-trail trail-2"></div>
                    <div id="card" class="card">
                        <div class="card-inner">
                            <div class="card-front">
                                <div class="card-corner top-left">
                                    <span>🍺</span>
                                </div>
                                <div class="card-corner top-right">
                                    <span>🍺</span>
                                </div>
                                <div class="card-center">
                                    <span class="card-suit">🍺</span>
                                    <span id="cardText" class="card-text"></span>
                                </div>
                                <div class="card-corner bottom-left">
                                    <span>🍺</span>
                                </div>
                                <div class="card-corner bottom-right">
                                    <span>🍺</span>
                                </div>
                                <div class="card-shine"></div>
                                <div class="card-holo"></div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="controls">
                    <button class="premium-btn secondary undo-btn" data-action="undo-card">
                        <span class="btn-icon-wrapper">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M3 10h10a5 5 0 0 1 5 5v2M3 10l6-6M3 10l6 6"/>
                            </svg>
                        </span>
                        <span>Undo</span>
                    </button>
                    <button class="premium-btn primary large draw-btn" data-action="next-card">
                        <span class="btn-bg"></span>
                        <span class="btn-content">
                            <span class="btn-text-inner">Draw Card</span>
                            <span class="draw-icon">🃏</span>
                        </span>
                        <span class="btn-glow"></span>
                        <span class="btn-particles"></span>
                    </button>
                </div>
                
                <div class="game-footer">
                    <div class="progress-bar">
                        <div class="progress-fill"></div>
                    </div>
                </div>
            </section>
        </main>
        
        <div class="sound-toggle" id="soundToggle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 5L6 9H2v6h4l5 4V5z"/>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
            </svg>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
